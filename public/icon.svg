<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Code brackets & Book symbol -->
  <g transform="translate(100, 100)" fill="none" stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M 90,60 L 30,156 L 90,252" stroke="url(#accent-grad)" stroke-width="28" filter="url(#glow)" />
    <!-- Right Bracket > -->
    <path d="M 222,60 L 282,156 L 222,252" stroke="url(#accent-grad)" stroke-width="28" filter="url(#glow)" />
    <!-- Slash / -->
    <path d="M 175,70 L 137,242" stroke="#ffffff" stroke-width="24" opacity="0.9" />
  </g>

  <!-- Star / Sparkle dot at top right -->
  <circle cx="390" cy="120" r="16" fill="#fde047" />
  <path d="M 390,95 L 390,145 M 365,120 L 415,120" stroke="#fde047" stroke-width="6" stroke-linecap="round" />
</svg>
